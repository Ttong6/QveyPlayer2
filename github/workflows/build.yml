name: Build APK from ZIP

on:
  workflow_dispatch:        # 手动点击运行
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip source
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -1)
          echo "找到压缩包: $ZIP"
          mkdir -p src
          unzip -q "$ZIP" -d src
          echo "解压后结构："
          find src -maxdepth 2 -type d | head -20

      - name: Locate project root
        id: locate
        run: |
          GW=$(find src -name gradlew -type f | head -1)
          if [ -z "$GW" ]; then
            echo "::error::压缩包里没有 gradlew，请把 gradle wrapper 一起打包"
            exit 1
          fi
          DIR=$(dirname "$GW")
          echo "项目根目录: $DIR"
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: src/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
